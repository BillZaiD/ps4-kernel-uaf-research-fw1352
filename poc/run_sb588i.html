  #state { font-size:22px; font-weight:700; margin:0 0 10px; }
  #out { white-space:pre-wrap; font:12px/1.45 Consolas, monospace;
         background:#11151b; border:1px solid #1e2732; border-radius:5px;

<body>
<div id="wrap">
  <div id="state">loading 13.52 netcontrol ucred UAF (e-vb)...</div>
  <div id="out"></div>
</div>
<script type="module">
function report(tag, msg) {
  var o = document.getElementById("out");
  if (o) o.textContent += tag + ": " + msg + "\n";
  try {
    var x = new XMLHttpRequest();
    x.open("GET", "log?m=" + encodeURIComponent("[" + tag + "] " + msg), true);
    x.send();
  } catch (e) {}
}
window.addEventListener("error", function (e) {
  report("MODULE-FAIL", (e.message || e.type || "unknown") + " " + (e.filename || "") + ":" + (e.lineno || ""));
}, true);
window.addEventListener("unhandledrejection", function (e) {
  var r = e.reason;
  var msg;
  try { msg = "name=" + r.name + " message=" + r.message; }
  catch (ex) { msg = String(r); }
  report("MODULE-REJECT", msg);
});
try {
  import("./chain_sb588i.js");
} catch (err) {
  report("IMPORT-CATCH", String(err && err.message ? err.message : err));
}
</script>
