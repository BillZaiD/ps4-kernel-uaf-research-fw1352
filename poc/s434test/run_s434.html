<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 FW13.52 -- Kernel Research</title>
<style>
html,body{margin:0;padding:0;background:#0b0d10;color:#c8ced8;font:15px/1.45 "Segoe UI",system-ui,sans-serif}
#wrap{padding:16px 18px}
#state{font-size:22px;font-weight:700;margin:0 0 10px}
#out{white-space:pre-wrap;font:12px/1.45 Consolas,monospace;background:#11151b;border:1px solid #1e2732;border-radius:5px;padding:10px 12px;height:calc(100vh - 80px);overflow-y:auto}
.ok{color:#7fd0a0}.bad{color:#d08a7f}.warn{color:#d8c07f}
#reload-indicator{position:fixed;top:8px;right:12px;font-size:11px;padding:3px 8px;border-radius:4px;z-index:9999;display:none;font-family:monospace}
#reload-indicator.reloading{display:block;background:#d08a7f;color:#fff}
#reload-indicator.connected{display:block;background:#7fd0a0;color:#0b0d10}
</style>
</head>
<body>
<div id="reload-indicator"></div>
<div id="wrap">
<div id="state">connecting to server...</div>
<div id="out"></div>
</div>

<!-- Live reload via SSE -->
<script>
(function() {
    var ind = document.getElementById("reload-indicator");
    function sseConnect() {
        var es = new EventSource("/events");
        es.addEventListener("init", function(e) {
            var d = JSON.parse(e.data);
            ind.className = "connected";
            ind.textContent = "connected #" + d.token;
            ind.style.display = "block";
        });
        es.addEventListener("reload", function(e) {
            ind.className = "reloading";
            ind.textContent = "RELOADING...";
            ind.style.display = "block";
            setTimeout(function() { location.reload(); }, 200);
        });
        es.onerror = function() {
            ind.className = "reloading";
            ind.textContent = "server offline";
            ind.style.display = "block";
            es.close();
            setTimeout(sseConnect, 3000);
        };
    }
    sseConnect();
})();
</script>

<!-- Load probe code (dynamically built from src/ by server) -->
<script src="/chain_all.js"></script>
</body>
</html>
